services:
  redis:
    image: redis:7-alpine
    container_name: ai_recruiter_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_recruiter_backend_prod
    restart: always
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - ALLOWED_HOSTS=*
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_recruiter_celery_prod
    restart: always
    command: celery -A backend worker -l INFO
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ai_recruiter_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
  media_data:

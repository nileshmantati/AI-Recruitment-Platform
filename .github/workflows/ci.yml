name: AI Recruitment Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: 🐍 Django Backend Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: 'ci-temporary-secret-key-for-testing'
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🩺 Django System Check
        run: python manage.py check

      - name: 🔍 Check for Missing Database Migrations
        run: python manage.py makemigrations --check

      - name: 🧪 Run Django Test Suite
        run: python manage.py test

  frontend-ci:
    name: ⚛️ React Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🧹 Run ESLint Validation
        run: npm run lint

      - name: 🏗️ Verify Vite Production Build
        run: npm run build
